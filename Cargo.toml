[package]
name = "caint"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptographic primitives
chacha20poly1305 = "0.10.1"
chacha20 = "0.9.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
curve25519-dalek = "4.1.3"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"

# Memory safety
zeroize = { version = "1.8.1", features = ["derive"] }
subtle = "2.6.1"

# Randomness
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "2.0.0-rc.3"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "sync", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

[features]
default = []
